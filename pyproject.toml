[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "another-youtube-auto-publisher"
version = "0.1.0"
description = "Fully automated YouTube publishing on AWS: analyze videos, extract meaningful Shorts, generate English metadata, publish on schedule."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Ugo Palumbo" }]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "boto3>=1.35",
]

[tool.hatch.build.targets.wheel]
packages = ["autopublisher"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
